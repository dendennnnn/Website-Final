<body>
    <style>
        body {
    background-color:  #6667AB;
   
}
/* Reset some default styling */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Global Styles */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    color: #333;
}

/* Header Styling */
.header {
    background-color: #4CAF50;
    color: white;
    text-align: center;
    padding: 20px;
}

.header h1 {
    font-size: 2.5em;
}

/* Navigation Styling */
#nav {
    background-color: #333;
    color: white;
}

#nav ul {
    list-style-type: none;
    padding: 0;
}

#nav ul li {
    display: inline-block;
    margin-right: 20px;
}

#nav ul li a {
    color: white;
    text-decoration: none;
    font-size: 1.2em;
    padding: 10px;
    display: inline-block;
    transition: background-color 0.3s ease;
}

#nav ul li a:hover {
    background-color: #4CAF50;
}

/* Main Section Styling */
.main {
    padding: 40px;
    text-align: center;
}

.main p {
    font-size: 1.5em;
    color: #555;
}

/* Footer Styling */
.footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 15px;
    position: absolute;
    width: 100%;
    bottom: 0;
}

 
    </style>

    </div>

    <div class="footer">

    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Name Picker</title>
    <link rel="stylesheet" href="act13.css">
    <script src="act13.js"></script>
</head>
<body>
    <div class="container">
        <textarea id="namesInput" placeholder></textarea>
        <div class="buttons">
            <button id="pickButton">Pick A Name</button>
            <button id="clearButton">Clear</button>
        </div>
        <div id="results">
            <p id="totalNames">Total names: 0</p>
            <p id="randomIndex">Random number picked: -</p>
            <h1 id="pickedName"></h1>
        </div>
    </div>
  
</body>
</html>
